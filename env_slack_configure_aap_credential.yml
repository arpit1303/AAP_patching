---
- name: Configure Slack Webhook Credential in AAP
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    controller_url: "{{ controller_url | default(aap_url | default(lookup('env', 'AAP_URL') | default('', true))) }}"
    controller_user: "{{ controller_user | default(aap_user | default(lookup('env', 'AAP_USER') | default('', true))) }}"
    controller_pass: "{{ controller_pass | default(aap_pass | default(lookup('env', 'AAP_PASS') | default('', true))) }}"
    organization_name: "{{ organization_name | default('Default') }}"
    slack_credential_name: "{{ slack_credential_name | default('Slack Webhook') }}"
    slack_webhook_url: "{{ slack_webhook_url | default('') }}"
    slack_channel: "{{ slack_channel | default('') }}"
    slack_username: "{{ slack_username | default('AAP') }}"

  tasks:
    - name: Validate required inputs
      ansible.builtin.assert:
        that:
          - controller_url | length > 0
          - controller_user | length > 0
          - controller_pass | length > 0
          - slack_webhook_url | length > 0
        fail_msg: >-
          Set controller_url, controller_user, controller_pass, and
          slack_webhook_url at launch.

    - name: Lookup organization
      ansible.builtin.uri:
        url: "{{ controller_url }}/api/controller/v2/organizations/?name={{ organization_name | urlencode }}"
        method: GET
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        force_basic_auth: true
        validate_certs: false
      register: organization_lookup

    - name: Require organization
      ansible.builtin.assert:
        that:
          - organization_lookup.json.count | int > 0
        fail_msg: "Organization {{ organization_name }} not found."

    - name: Set organization id
      ansible.builtin.set_fact:
        organization_id: "{{ organization_lookup.json.results[0].id }}"

    - name: Lookup Slack credential type
      ansible.builtin.uri:
        url: "{{ controller_url }}/api/controller/v2/credential_types/?name=Slack%20Webhook"
        method: GET
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        force_basic_auth: true
        validate_certs: false
      register: credential_type_lookup

    - name: Create Slack credential type if missing
      ansible.builtin.uri:
        url: "{{ controller_url }}/api/controller/v2/credential_types/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: Slack Webhook
          kind: cloud
          inputs:
            fields:
              - id: slack_webhook_url
                type: string
                label: Slack Webhook URL
                secret: true
              - id: slack_channel
                type: string
                label: Slack Channel
                default: ""
              - id: slack_username
                type: string
                label: Slack Username
                default: AAP
          injectors:
            env:
              SLACK_WEBHOOK_URL: "{{ '{{ slack_webhook_url }}' }}"
              SLACK_CHANNEL: "{{ '{{ slack_channel }}' }}"
              SLACK_USERNAME: "{{ '{{ slack_username }}' }}"
      when: credential_type_lookup.json.count | int == 0
      register: credential_type_create

    - name: Set Slack credential type id
      ansible.builtin.set_fact:
        slack_credential_type_id: >-
          {{
            (credential_type_lookup.json.results[0].id
            if credential_type_lookup.json.count | int > 0
            else credential_type_create.json.id)
          }}

    - name: Lookup existing Slack credential
      ansible.builtin.uri:
        url: >-
          {{ controller_url }}/api/controller/v2/credentials/?name={{
          slack_credential_name | urlencode }}&organization={{ organization_id }}
        method: GET
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        force_basic_auth: true
        validate_certs: false
      register: credential_lookup

    - name: Create Slack credential
      ansible.builtin.uri:
        url: "{{ controller_url }}/api/controller/v2/credentials/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: "{{ slack_credential_name }}"
          organization: "{{ organization_id }}"
          credential_type: "{{ slack_credential_type_id }}"
          inputs:
            slack_webhook_url: "{{ slack_webhook_url }}"
            slack_channel: "{{ slack_channel }}"
            slack_username: "{{ slack_username }}"
      when: credential_lookup.json.count | int == 0

    - name: Update Slack credential
      ansible.builtin.uri:
        url: "{{ controller_url }}/api/controller/v2/credentials/{{ credential_lookup.json.results[0].id }}/"
        method: PATCH
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: "{{ slack_credential_name }}"
          organization: "{{ organization_id }}"
          credential_type: "{{ slack_credential_type_id }}"
          inputs:
            slack_webhook_url: "{{ slack_webhook_url }}"
            slack_channel: "{{ slack_channel }}"
            slack_username: "{{ slack_username }}"
      when: credential_lookup.json.count | int > 0

    - name: Show configured Slack credential
      ansible.builtin.debug:
        msg:
          - "Credential name: {{ slack_credential_name }}"
          - "Slack channel: {{ slack_channel | default('webhook default', true) }}"
          - "Slack username: {{ slack_username }}"

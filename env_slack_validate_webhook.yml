---
- name: Validate Slack Webhook
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    validate_slack_webhook_url: "{{ slack_webhook_url | default(lookup('env', 'SLACK_WEBHOOK_URL') | default('', true)) }}"
    validate_slack_channel: "{{ slack_channel | default(lookup('env', 'SLACK_CHANNEL') | default('', true)) }}"
    validate_slack_username: "{{ slack_username | default(lookup('env', 'SLACK_USERNAME') | default('AAP', true)) }}"
    validate_slack_message: "{{ slack_message | default('AAP_Patch Slack webhook validation message') }}"

  tasks:
    - name: Validate required inputs
      ansible.builtin.assert:
        that:
          - validate_slack_webhook_url | length > 0
        fail_msg: "Provide a Slack credential at launch or set slack_webhook_url."

    - name: Send validation message to Slack
      ansible.builtin.uri:
        url: "{{ validate_slack_webhook_url }}"
        method: POST
        body_format: json
        body:
          text: "{{ validate_slack_message }}"
          username: "{{ validate_slack_username }}"
          channel: "{{ ('#' ~ validate_slack_channel) if validate_slack_channel | length > 0 else omit }}"
        status_code: 200

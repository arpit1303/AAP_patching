---
- name: Create AWS Keypair for TAM_DAY Demo
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    create_vm_aws_region: "{{ create_vm_aws_region | default('us-east-1') }}"
    aws_key_name: "{{ aws_key_name | default('aws-test-key') }}"
    aws_public_key: "{{ aws_public_key | default('') }}"
    aws_keypair_owner: "{{ aws_keypair_owner | default('TAM') }}"

  tasks:
    - name: Require public key
      ansible.builtin.assert:
        that:
          - aws_public_key | length > 0
        fail_msg: "Set aws_public_key at launch."

    - name: Create AWS EC2 keypair
      amazon.aws.ec2_key:
        name: "{{ aws_key_name }}"
        region: "{{ create_vm_aws_region }}"
        key_material: "{{ aws_public_key }}"
        state: present
        tags:
          owner: "{{ aws_keypair_owner }}"
          purpose: tam_day_demo

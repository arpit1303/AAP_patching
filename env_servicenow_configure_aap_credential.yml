---
- name: Configure ServiceNow Credential in AAP
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    controller_url: "{{ controller_url | default(aap_url | default(lookup('env', 'AAP_URL') | default('', true))) }}"
    controller_user: "{{ controller_user | default(aap_user | default(lookup('env', 'AAP_USER') | default('', true))) }}"
    controller_pass: "{{ controller_pass | default(aap_pass | default(lookup('env', 'AAP_PASS') | default('', true))) }}"
    organization_name: "{{ organization_name | default('Default') }}"
    servicenow_credential_name: "{{ servicenow_credential_name | default('ServiceNow') }}"
    servicenow_host: "{{ servicenow_host | default('https://your-instance.service-now.com/') }}"
    servicenow_username: "{{ servicenow_username | default('') }}"
    servicenow_password: "{{ servicenow_password | default('') }}"

  tasks:
    - name: Validate required inputs
      ansible.builtin.assert:
        that:
          - controller_url | length > 0
          - controller_user | length > 0
          - controller_pass | length > 0
          - servicenow_password | length > 0
        fail_msg: >-
          Set controller_url, controller_user, controller_pass, and
          servicenow_password at launch.

    - name: Lookup organization
      ansible.builtin.uri:
        url: "{{ controller_url }}/api/controller/v2/organizations/?name={{ organization_name | urlencode }}"
        method: GET
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        force_basic_auth: true
        validate_certs: false
      register: organization_lookup

    - name: Require organization
      ansible.builtin.assert:
        that:
          - organization_lookup.json.count | int > 0
        fail_msg: "Organization {{ organization_name }} not found."

    - name: Set organization id
      ansible.builtin.set_fact:
        organization_id: "{{ organization_lookup.json.results[0].id }}"

    - name: Lookup ServiceNow credential type
      ansible.builtin.uri:
        url: "{{ controller_url }}/api/controller/v2/credential_types/?name=ServiceNow"
        method: GET
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        force_basic_auth: true
        validate_certs: false
      register: credential_type_lookup

    - name: Create ServiceNow credential type if missing
      ansible.builtin.uri:
        url: "{{ controller_url }}/api/controller/v2/credential_types/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: ServiceNow
          kind: cloud
          inputs:
            fields:
              - id: sn_host
                type: string
                label: ServiceNow Host (https://your-instance.service-now.com)
              - id: sn_username
                type: string
                label: Username
              - id: sn_password
                type: string
                label: Password
                secret: true
          injectors:
            env:
              SN_HOST: "{{ '{{ sn_host }}' }}"
              SN_USERNAME: "{{ '{{ sn_username }}' }}"
              SN_PASSWORD: "{{ '{{ sn_password }}' }}"
      when: credential_type_lookup.json.count | int == 0
      register: credential_type_create

    - name: Set ServiceNow credential type id
      ansible.builtin.set_fact:
        servicenow_credential_type_id: >-
          {{
            (credential_type_lookup.json.results[0].id
            if credential_type_lookup.json.count | int > 0
            else credential_type_create.json.id)
          }}

    - name: Lookup existing ServiceNow credential
      ansible.builtin.uri:
        url: >-
          {{ controller_url }}/api/controller/v2/credentials/?name={{
          servicenow_credential_name | urlencode }}&organization={{ organization_id }}
        method: GET
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        force_basic_auth: true
        validate_certs: false
      register: credential_lookup

    - name: Create ServiceNow credential
      ansible.builtin.uri:
        url: "{{ controller_url }}/api/controller/v2/credentials/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: "{{ servicenow_credential_name }}"
          organization: "{{ organization_id }}"
          credential_type: "{{ servicenow_credential_type_id }}"
          inputs:
            sn_host: "{{ servicenow_host }}"
            sn_username: "{{ servicenow_username }}"
            sn_password: "{{ servicenow_password }}"
      when: credential_lookup.json.count | int == 0
      register: credential_create

    - name: Update ServiceNow credential
      ansible.builtin.uri:
        url: "{{ controller_url }}/api/controller/v2/credentials/{{ credential_lookup.json.results[0].id }}/"
        method: PATCH
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: "{{ servicenow_credential_name }}"
          organization: "{{ organization_id }}"
          credential_type: "{{ servicenow_credential_type_id }}"
          inputs:
            sn_host: "{{ servicenow_host }}"
            sn_username: "{{ servicenow_username }}"
            sn_password: "{{ servicenow_password }}"
      when: credential_lookup.json.count | int > 0
      register: credential_update

    - name: Show configured ServiceNow credential
      ansible.builtin.debug:
        msg:
          - "Credential name: {{ servicenow_credential_name }}"
          - "ServiceNow host: {{ servicenow_host }}"
          - "ServiceNow username: {{ servicenow_username }}"

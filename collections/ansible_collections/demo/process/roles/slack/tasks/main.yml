---
- name: Skip Slack notification when webhook is not configured
  ansible.builtin.debug:
    msg: "SLACK_WEBHOOK_URL is not configured; skipping Slack notification."
  when: not slack_enabled | bool

- name: Send notification message via Slack webhook
  ansible.builtin.uri:
    url: "{{ slack_webhook_url }}"
    method: POST
    body_format: json
    body:
      text: "{{ slack_message }}"
      username: "{{ slack_username }}"
      channel: "{{ ('#' ~ slack_channel_name) if slack_channel_name | length > 0 else omit }}"
    status_code: 200
  when: slack_enabled | bool

